name: Unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version override (default: version from project.yml)"
        required: false
        default: ""

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build unsigned IPA
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION="$(sed -nE 's/.*MARKETING_VERSION: ([0-9]+(\.[0-9]+){0,2}).*/\1/p' project.yml | head -1)"
          fi
          echo "Building version $VERSION build $RUN_NUMBER"
          BUILD_VERSION="$VERSION" BUILD_NUMBER="$RUN_NUMBER" bash build-unsigned-ipa.sh

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: build/unsigned-ipa/**/*.ipa
          if-no-files-found: error
